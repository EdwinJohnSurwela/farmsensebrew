# FarmSense Brew — full stack on Podman (FB-52 + FB-53)
# Usage:  podman compose up -d --build     (from this directory)
# Stop:   podman compose down              (volumes persist)
#
# Copy deploy/env.example to .env in this directory first and edit secrets.
# NOTE: stop XAMPP MySQL before starting if you publish port 3306.

services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "3001:3001"          # Flutter app / web app / ESP32 all talk to this
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: farmsense_db
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "false"
      GRAFANA_INTERNAL_URL: http://grafana:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OFFLINE_BUFFER_PATH: /opt/farmsense/backend/data/offline-buffer.db
      ML_SERVICE_URL: http://ml:5000
      DB_TIMEZONE: "Z"          # MariaDB container clock is UTC (see db.service.js)
      TZ: Asia/Manila           # irrigation schedule times and PDF times in Philippine time
    volumes:
      - api-data:/opt/farmsense/backend/data   # SQLite offline buffer survives restarts
    depends_on:
      - mysql
      - grafana
    restart: always

  mysql:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: farmsense_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro   # seeds schema+data on first start
    restart: always
    # Uncomment to reach the DB from the host (conflicts with XAMPP's 3306):
    # ports:
    #   - "3307:3306"

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_SERVER_ROOT_URL: http://192.168.1.151:3001/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 2s   # dashboards refresh every 2 s, like the web app
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_MYSQL_PASSWORD: ${DB_ROOT_PASSWORD}   # used by provisioned datasource
      # 12-hour clock with AM/PM on charts and time pickers
      GF_DATE_FORMATS_FULL_DATE: "MMM D, YYYY h:mm:ss A"
      GF_DATE_FORMATS_INTERVAL_SECOND: "h:mm:ss A"
      GF_DATE_FORMATS_INTERVAL_MINUTE: "h:mm A"
      GF_DATE_FORMATS_INTERVAL_HOUR: "MMM D, h:mm A"
      GF_DATE_FORMATS_INTERVAL_DAY: "MMM D"
      GF_DATE_FORMATS_INTERVAL_MONTH: "MMM YYYY"
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - mysql
    restart: always

  ml:
    build:
      context: ./ml-service
      dockerfile: Containerfile
    ports:
      - "5000:5000"
    restart: always

volumes:
  api-data:
  mysql-data:
  grafana-data:
