# ═══════════════════════════════════════════════════════════════════════════════
# FarmSense Brew — Grafana Configuration for Single Sign-On (Auth Proxy)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Copy the settings below into your Grafana config file:
#   Windows (XAMPP): C:\Program Files\GrafanaLabs\grafana\conf\defaults.ini
#            or use: conf\custom.ini  (preferred — survives upgrades)
#
# ARCHITECTURE:
#   Browser → FarmSense Portal (Node.js :3001) → /grafana proxy → Grafana (:3000)
#                           ↓
#              JWT cookie validates user
#                           ↓
#              Proxy adds X-WEBAUTH-USER header
#                           ↓
#              Grafana auto-signs in user (no 2nd login)
#
# AFTER editing grafana.ini, restart the Grafana service:
#   Windows: services.msc → "Grafana" → Restart
#   Linux:   sudo systemctl restart grafana-server
#
# THEN run the provisioning script:
#   node config/grafana-setup.js
# ═══════════════════════════════════════════════════════════════════════════════

[server]
# root_url MUST match the proxy path your browser uses.
# Use http://127.0.0.1:3001/grafana/ — NOT localhost (cookie mismatch).
root_url = http://127.0.0.1:3001/grafana/
serve_from_sub_path = true

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
# Only the Node.js proxy should send this header. Add your proxy IP if needed.
whitelist = 127.0.0.1, ::1

[auth]
# Hide Grafana's login form — only the FarmSense portal handles authentication.
# Comment this out if you need direct Grafana admin access for recovery.
disable_login_form = true
# Hide the sign-out button in Grafana — sign-out is handled by the portal.
disable_signout_menu = true

[users]
# Default role for auto-created proxy users. The provisioning script
# assigns specific folder permissions per user.
auto_assign_org_role = Viewer
allow_sign_up = false
# Prevent Viewer-role users from editing panels (view-only experience)
viewers_can_edit = false

[security]
# Allow embedding in iframes (if needed for future integration)
allow_embedding = true
