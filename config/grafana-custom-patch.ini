
# ═══════════════════════════════════════════════════════════════════════════════
# FarmSense Brew — Grafana Custom Settings (appended to custom.ini)
# Applied by: node config/grafana-setup.js or manually
# ═══════════════════════════════════════════════════════════════════════════════

[server]
root_url = http://127.0.0.1:3001/grafana/
serve_from_sub_path = true

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
whitelist = 127.0.0.1, ::1

[users]
auto_assign_org_role = Viewer
allow_sign_up = false
viewers_can_edit = false

[security]
allow_embedding = true
